/* iauthd-c config for e2e tests against undernet-development-env.

   CHECK goes to real GNUWorld (channels.undernet.org).
   VERIFY is answered by a host-side P10 peer (verify.test.net).
*/

core {
    library_path ( "/opt/iauthd/lib/iauthd-c" )
    modules ( iauth_xquery, iauth_class )
}

logs {
    "*.>=debug" "file:/tmp/iauthd-c.log"
}

iauth {
    timeout 15
}

iauth_xquery {
    channels.undernet.org combined
    verify.test.net verify
}

iauth_class {
    "r050" { class Simulation; account "Admin" }
    "r100" { class Simulation; xreply_ok "channels.undernet.org" }
    "r101" { class Simulation; xreply_ok "verify.test.net" }
    "r900" { class Simulation }
}
